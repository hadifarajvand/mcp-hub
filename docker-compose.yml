# MCP Hub: deploy as a Dokploy "Compose" application.
# Only `gateway` is reachable from outside (via Dokploy's Traefik, configured in
# the Domains tab → service: gateway, port: 8080). No service publishes host ports.
# Every MCP is served at https://<domain>/<name>/mcp behind a bearer token.

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - hub
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  gateway:
    <<: *hardening
    build: ./gateway
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MCP_HUB_TOKEN: ${MCP_HUB_TOKEN:?MCP_HUB_TOKEN is required}
      MCP_HUB_TOKEN_2: ${MCP_HUB_TOKEN_2:-}
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      XDG_DATA_HOME: /tmp
      XDG_CONFIG_HOME: /tmp
    networks:
      - hub
      - fetchnet
      - dokploy-network
    depends_on:
      - dokploy
      - github
      - transcriber
      - google-workspace
      - web
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  dokploy:
    <<: *hardening
    build: ./servers/dokploy
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DOKPLOY_URL: ${DOKPLOY_URL:-}
      DOKPLOY_API_KEY: ${DOKPLOY_API_KEY:-}
      # all | minimal | core | deploy | databases | git
      DOKPLOY_TOOL_PRESET: ${DOKPLOY_TOOL_PRESET:-deploy}
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  github:
    <<: *hardening
    build: ./servers/github
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # Read-only unless explicitly switched off.
      GITHUB_READ_ONLY: ${GITHUB_READ_ONLY:-1}
      GITHUB_TOOLSETS: ${GITHUB_TOOLSETS:-default}
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  transcriber:
    <<: *hardening
    build:
      context: ./servers
      dockerfile: transcriber/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:size=512m
    networks: [fetchnet]
    environment:
      GOOGLE_CREDENTIALS_JSON: ${GOOGLE_CREDENTIALS_JSON:-}
      TRANSCRIBER_MAX_INPUT_MB: ${TRANSCRIBER_MAX_INPUT_MB:-20}
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  # Web search + fetch. Lives on `fetchnet`, which cannot reach dokploy/github/workspace.
  web:
    <<: *hardening
    build:
      context: ./servers
      dockerfile: web/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    networks: [fetchnet]
    environment:
      SEARXNG_URL: http://searxng:8080
      WEB_RESPECT_ROBOTS: ${WEB_RESPECT_ROBOTS:-true}
      WEB_RATE_PER_MIN: ${WEB_RATE_PER_MIN:-60}
    depends_on:
      - searxng
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  searxng:
    <<: *hardening
    image: searxng/searxng:2026.10.2-19ffbcd30
    user: "977:977"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/searxng:uid=977,gid=977
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [fetchnet]
    environment:
      GRANIAN_HOST: 0.0.0.0   # image default is :: (IPv6), which Docker bridge networks may lack
    # Random per-start secret (only signs ephemeral state); then the image's own entrypoint.
    entrypoint:
      - /bin/sh
      - -c
      - export SEARXNG_SECRET="$$(head -c 32 /dev/urandom | base64 | tr -dc A-Za-z0-9)"; exec /usr/local/searxng/entrypoint.sh
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  google-workspace:
    <<: *hardening
    build: ./servers/google-workspace
    read_only: true
    tmpfs:
      - /tmp
      - /home/app:uid=10001,gid=10001
    volumes:
      - google-workspace-credentials:/data/credentials
    environment:
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}/google-workspace/oauth2callback
      WORKSPACE_EXTERNAL_URL: ${PUBLIC_BASE_URL}/google-workspace
      USER_GOOGLE_EMAIL: ${USER_GOOGLE_EMAIL:-}
      WORKSPACE_MCP_TOOL_TIER: ${WORKSPACE_TOOL_TIER:-core}
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

volumes:
  google-workspace-credentials:

networks:
  hub:
  fetchnet:        # services that fetch arbitrary internet URLs; isolated from trusted MCPs
  dokploy-network:
    external: true

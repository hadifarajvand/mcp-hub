version: "3.8"

services:
  # Transcriber MCP only — for local testing (no external dependencies)
  transcriber:
    build:
      context: ./servers/transcriber
      dockerfile: Dockerfile
    container_name: mcp-transcriber-test
    env_file:
      - ./servers/transcriber/.env
    ports:
      - "8002:8000"
    volumes:
      - transcriber-whisper:/app/whisper_models
    environment:
      - MCP_HTTP_PORT=8000
      - MCP_HOST=0.0.0.0
      - WHISPER_MODEL=tiny
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  transcriber-whisper:
    driver: local

networks:
  default:
    name: mcp-hub-test-network
    driver: bridge

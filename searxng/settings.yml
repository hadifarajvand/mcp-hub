# SearXNG settings for the MCP hub web server. Reachable only from the `web`
# container on the internal `fetchnet` network; never exposed by the gateway.
use_default_settings: true

general:
  instance_name: "mcp-hub search"
  enable_metrics: false

server:
  # secret_key comes from $SEARXNG_SECRET (set by the compose entrypoint).
  limiter: false          # internal-only behind our own auth; the limiter needs Valkey
  public_instance: false
  image_proxy: false

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json                # required by the web MCP

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
